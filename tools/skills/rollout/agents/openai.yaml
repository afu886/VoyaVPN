interface:
  display_name: "Rollout"
  short_description: "Plan large refactors and migrations with a selectable agent"
  default_prompt: "Use $rollout to draft an upstream spec, derive a phase-and-batch plan, and generate a runner for the selected agent when appropriate."

rollout:
  name: "codex"
  display_name: "Codex"
  default_command: "codex exec --dangerously-bypass-approvals-and-sandbox --cd {repo} -"
  dry_run_command:
    - "codex"
    - "exec"
    - "-"
  legacy_command_key: "codex_cmd"
  legacy_command_flag: "--codex-cmd"
  model_placement: "before_stdin_marker"
  stdin_marker: "-"
  ensure_stdin_marker: true
