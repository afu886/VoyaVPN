interface:
  display_name: "Rollout"
  short_description: "Plan large refactors and migrations with a selectable agent"
  default_prompt: "Use $rollout to draft an upstream spec, derive a phase-and-batch plan, and generate a runner for the selected agent when appropriate."

rollout:
  name: "claude"
  display_name: "Claude Code"
  default_command: "claude -p --dangerously-skip-permissions --output-format text"
  dry_run_command:
    - "claude"
    - "-p"
  legacy_command_key: "claude_cmd"
  legacy_command_flag: "--claude-cmd"
  model_placement: "append"
  stdin_marker: null
  ensure_stdin_marker: false
